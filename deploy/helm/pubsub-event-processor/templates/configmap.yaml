apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "processor.fullname" . }}
  labels:
    {{- include "processor.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  HTTP_ADDR: {{ printf ":%d" (int .Values.service.port) | quote }}
  PUBSUB_ENDPOINT: {{ .Values.config.pubsubEndpoint | quote }}
  SF_LOGIN_URL: {{ .Values.config.salesforceLoginUrl | quote }}
  SF_TOPICS: {{ .Values.config.topics | quote }}
  WORKER_COUNT: {{ .Values.config.workerCount | quote }}
  FLOW_BATCH_SIZE: {{ .Values.config.flowBatchSize | quote }}
  DATABASE_MAX_CONNS: {{ .Values.config.databaseMaxConns | quote }}
  SINK_WEBHOOK_URL: {{ .Values.config.sinkWebhookUrl | quote }}
  REDIS_ENABLED: {{ .Values.redis.enabled | quote }}
{{- if .Values.redis.enabled }}
  REDIS_ADDR: {{ include "processor.redisAddr" . | quote }}
  REDIS_DB: {{ .Values.redis.db | quote }}
  REDIS_KEY_PREFIX: {{ .Values.redis.keyPrefix | quote }}
  REDIS_TTL: {{ .Values.redis.ttl | quote }}
  REDIS_TIMEOUT: {{ .Values.redis.timeout | quote }}
{{- end }}
  KAFKA_ENABLED: {{ .Values.kafka.enabled | quote }}
{{- if .Values.kafka.enabled }}
  KAFKA_BROKERS: {{ required "kafka.brokers is required when kafka.enabled is true" .Values.kafka.brokers | quote }}
  KAFKA_TOPIC: {{ .Values.kafka.topic | quote }}
  KAFKA_CLIENT_ID: {{ .Values.kafka.clientId | quote }}
  KAFKA_PRODUCE_TIMEOUT: {{ .Values.kafka.produceTimeout | quote }}
  KAFKA_CREATE_TOPIC: {{ .Values.kafka.createTopic | quote }}
  KAFKA_TOPIC_PARTITIONS: {{ .Values.kafka.topicPartitions | quote }}
  KAFKA_TOPIC_REPLICATION_FACTOR: {{ .Values.kafka.topicReplicationFactor | quote }}
{{- end }}
