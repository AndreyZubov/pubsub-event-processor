{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "processor.fullname" . }}
  labels:
    {{- include "processor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "processor.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Scraping and probes reach the admin port; nothing else is exposed.
    - ports:
        - port: {{ .Values.service.portName }}
          protocol: TCP
  egress:
    # DNS resolution.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.postgres.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "processor.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: database
      ports:
        - port: 5432
          protocol: TCP
    {{- end }}
    {{- if .Values.kafka.enabled }}
    # Kafka brokers. Narrow this to the broker namespace in a real cluster.
    - ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
    {{- end }}
    # Salesforce: OAuth over 443, Pub/Sub gRPC over 7443.
    - to:
        {{- range .Values.networkPolicy.allowedExternalCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: 443
          protocol: TCP
        - port: 7443
          protocol: TCP
{{- end }}
