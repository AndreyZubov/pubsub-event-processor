{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "processor.fullname" . }}
  labels:
    {{- include "processor.labels" . | nindent 4 }}
type: Opaque
stringData:
  SF_CLIENT_ID: {{ required "secrets.clientId is required unless secrets.existingSecret is set" .Values.secrets.clientId | quote }}
  SF_CLIENT_SECRET: {{ required "secrets.clientSecret is required unless secrets.existingSecret is set" .Values.secrets.clientSecret | quote }}
  DATABASE_URL: {{ include "processor.databaseUrl" . | quote }}
{{- end }}
