# Scrapes a processor running on the host (`make run` or `make demo`) from the
# Prometheus container started by `make up-observability`. For another
# deployment, point the target at the service's HTTP_ADDR and load alerts.yml
# into that Prometheus.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: processor
    static_configs:
      - targets: ["host.docker.internal:8080"]
